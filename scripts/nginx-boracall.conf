# /etc/nginx/sites-available/boracall.com
#
# Sirva:
#   https://boracall.com           → landing page estática
#   https://boracall.com/downloads → binários .dmg/.msi/.exe/.AppImage/.deb/.rpm
#   https://api.boracall.com       → Rust server (REST + WebSocket)
#   https://boracall.com/s/<slug>  → redirect que abre o desktop via deep link
#
# TLS via Let's Encrypt (certbot --nginx -d boracall.com -d api.boracall.com).
# Substitua os caminhos de cert pra corresponder ao que o certbot gera no seu host.

# ---------------- HTTP → HTTPS ----------------
server {
    listen 80;
    listen [::]:80;
    server_name boracall.com www.boracall.com api.boracall.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------- Landing + downloads ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name boracall.com www.boracall.com;

    ssl_certificate     /etc/letsencrypt/live/boracall.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boracall.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Strong security headers. Adjust CSP if you add 3rd-party analytics.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Redirect www → apex
    if ($host = www.boracall.com) { return 301 https://boracall.com$request_uri; }

    # --- deep link handoff: /s/<slug> opens the native app ---
    # When someone clicks a link in a browser, show a simple redirect page that
    # attempts to open boracall://s/<slug> and falls back to the download page.
    # Link de canal: /c/<slug>. Serve a página de convite, que lê o slug do
    # caminho e ensina a colar no app.
    #
    # O /s/<slug> antigo (modelo de sala) continua respondendo pra não quebrar
    # link já compartilhado, mandando pra mesma página.
    location ~ ^/c/([a-z0-9]+)$ {
        try_files /convite.html =404;
    }
    location ~ ^/s/([a-z0-9-]+)$ {
        try_files /convite.html =404;
    }

    # --- landing (static) ---
    root /var/www/boracall/site;
    index index.html;

    # Long cache for immutable assets; no-cache for HTML.
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff2|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # --- downloads ---
    location /downloads/ {
        alias /var/www/boracall/downloads/;
        autoindex off;
        # Long cache; versioned filenames mean the cache is safe.
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Content-Disposition 'attachment' always;
        # Allow range requests for big binaries (resume support).
        add_header Accept-Ranges bytes always;
        # Whitelist extensions — anything else 404s.
        location ~ \.(dmg|msi|exe|AppImage|deb|rpm|txt|sig|json)$ {
            try_files $uri =404;
        }
        # SHA256SUMS is plain text, let it through.
        location = /downloads/SHA256SUMS {
            default_type text/plain;
            try_files $uri =404;
        }
    }
}

# ---------------- API ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.boracall.com;

    ssl_certificate     /etc/letsencrypt/live/api.boracall.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.boracall.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # WebSocket upgrade for signaling.
    location /ws/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Long-lived connections for calls.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST endpoints.
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
