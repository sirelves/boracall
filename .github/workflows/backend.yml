name: backend

# CI do server Rust. Roda em PR e push que toquem o backend.
#
# O build usa SQLX_OFFLINE=true, que lê o cache de queries commitado em `.sqlx/`
# em vez de exigir um Postgres vivo em tempo de compilação. O job `sqlx-cache`
# é o guarda-corpo disso: sobe um Postgres de verdade e falha se o cache estiver
# defasado em relação às queries do código.
#
# Nota: GitHub Actions não suporta âncoras YAML, por isso a lista de paths
# aparece duplicada em `push` e `pull_request`.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.sqlx/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.sqlx/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # fmt + clippy + build + test — sem banco, tudo via cache offline do sqlx.
  # ---------------------------------------------------------------------------
  check:
    name: fmt · clippy · build · test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SQLX_OFFLINE: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
          # src-tauri não é buildado aqui — chave própria pra não misturar
          # com o cache do job de release.
          key: backend

      - name: cargo fmt
        run: cargo fmt -p boracall-server -- --check

      - name: cargo clippy
        run: cargo clippy -p boracall-server --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build -p boracall-server --locked

      - name: cargo test
        run: cargo test -p boracall-server --locked

  # ---------------------------------------------------------------------------
  # Verifica que `.sqlx/` está em dia com as queries do código.
  #
  # Sem isso, alguém altera uma query, esquece de rodar `cargo sqlx prepare`, e o
  # job `check` continua verde compilando contra o cache velho — o erro só
  # apareceria no build de produção.
  # ---------------------------------------------------------------------------
  sqlx-cache:
    name: cache do sqlx em dia
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: boracall
          POSTGRES_USER: boracall
          POSTGRES_PASSWORD: boracall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boracall -d boracall"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgres://boracall:boracall@127.0.0.1:5432/boracall

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: backend-sqlx

      # Não está na lista de tools da action; ela cai no cargo-binstall
      # automaticamente, que baixa o binário pronto.
      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run migrations
        run: sqlx migrate run --source server/migrations

      - name: cargo sqlx prepare --check
        run: |
          if ! cargo sqlx prepare --check --workspace -- -p boracall-server; then
            echo "::error::O cache em .sqlx/ está desatualizado em relação às queries do código."
            echo "::error::Rode localmente com o Postgres no ar: cargo sqlx prepare --workspace -- -p boracall-server"
            exit 1
          fi
