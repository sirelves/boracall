name: release

# Triggered on a pushed version tag (vX.Y.Z) OR manual dispatch.
# Produces platform-native bundles on 3 runners, publishes them as a GitHub Release,
# and uploads them to the VPS (boracall.com/downloads/) via rsync.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without leading v)'
        required: true
        default: '0.1.0'

permissions:
  contents: write        # needed to create the GitHub Release

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest       # Apple Silicon + Intel via universal target
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # For universal-apple-darwin we need both aarch64 and x86_64 targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
            server

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Install node modules
        run: npm ci || npm install

      - name: Bake production API URL into dist/env.js
        shell: bash
        run: |
          cat > dist/env.js <<'EOF'
          // Baked at release time by .github/workflows/release.yml
          (function () {
            window.BC_API_URL    = window.BC_API_URL    || "https://api.boracall.com";
            window.BC_PUBLIC_URL = window.BC_PUBLIC_URL || "https://boracall.com";
          })();
          EOF

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization keys go here later when the Apple Developer
          # account is live. Leave unset for now — the build still succeeds unsigned.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
          releaseName: 'BoraCall ${{ github.ref_name || github.event.inputs.version }}'
          releaseBody: |
            See the site: https://boracall.com

            Artefatos nativos por plataforma abaixo. Binários também mirrorados em
            https://boracall.com/downloads/ depois do deploy.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Collect artifacts (uniform name)
        shell: bash
        run: |
          mkdir -p dist-release
          if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            cp target/universal-apple-darwin/release/bundle/dmg/*.dmg   dist-release/ 2>/dev/null || true
            # Individual arch bundles too (builds also emit per-target when available)
            cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg     dist-release/ 2>/dev/null || true
            cp target/x86_64-apple-darwin/release/bundle/dmg/*.dmg      dist-release/ 2>/dev/null || true
          elif [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            cp target/release/bundle/msi/*.msi                          dist-release/ 2>/dev/null || true
            cp target/release/bundle/nsis/*.exe                         dist-release/ 2>/dev/null || true
          else
            cp target/release/bundle/appimage/*.AppImage                dist-release/ 2>/dev/null || true
            cp target/release/bundle/deb/*.deb                          dist-release/ 2>/dev/null || true
            cp target/release/bundle/rpm/*.rpm                          dist-release/ 2>/dev/null || true
          fi
          ls -la dist-release/ || true

      - name: Upload artifacts for VPS deploy job
        uses: actions/upload-artifact@v4
        with:
          name: boracall-${{ matrix.platform }}
          path: dist-release/
          if-no-files-found: warn
          retention-days: 14

  deploy-vps:
    needs: build-tauri
    runs-on: ubuntu-22.04
    # Skip deploy when secrets aren't set yet (first few releases) — the artifacts are
    # still on the GH Release.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: Flatten
        run: |
          mkdir -p out
          find dist-release -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} out/ \;
          ls -lah out/
          # Generate SHA256 checksums the landing can verify against.
          ( cd out && shasum -a 256 * > SHA256SUMS )

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Rsync to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete out/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/boracall/downloads/"

      - name: Also attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
          files: |
            out/*
            out/SHA256SUMS

  deploy-landing:
    needs: build-tauri
    runs-on: ubuntu-22.04
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Rsync landing to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete landing/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/boracall/site/"
