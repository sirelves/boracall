name: release

# Dispara em tag "v*.*.*" (ou manual). Roda builds nativos em 4 runners em paralelo,
# coleta os bundles, publica em /var/www/boracall/downloads/ no VPS e cria um GitHub
# Release draft com todos os artefatos + SHA256SUMS.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (sem o "v" na frente), ex: 0.1.0'
        required: true
        default: '0.1.0'
      skip_deploy:
        description: 'Pular rsync pro VPS (só gera artefatos)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write  # necessário para criar o GH Release

env:
  # Único lugar pra trocar a versão do action (pinada, não flutuante).
  TAURI_ACTION_VERSION: v0.5.22

jobs:
  # ---------------------------------------------------------------------------
  # Build em 4 runners: macOS ARM + macOS Intel + Linux + Windows
  # ---------------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest           # arm64 nativo (Apple Silicon)
            bundle-glob: '*.dmg'
          - name: macos-intel
            runner: macos-13               # último runner Intel x86_64
            bundle-glob: '*.dmg'
          - name: linux
            runner: ubuntu-24.04
            bundle-globs: '*.AppImage,*.deb,*.rpm'
          - name: windows
            runner: windows-latest
            bundle-globs: '*.msi,*.exe'

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
            server

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Install node modules
        run: npm ci || npm install

      # Reescreve env.js pra apontar pra produção — ANTES do tauri build,
      # porque o dist/ é embutido dentro do binário em compile time.
      - name: Bake production env.js
        shell: bash
        run: |
          cat > dist/env.js <<'EOF'
          (function () {
            window.BC_API_URL    = window.BC_API_URL    || "https://api.boracall.com";
            window.BC_PUBLIC_URL = window.BC_PUBLIC_URL || "https://boracall.com";
          })();
          EOF

      # Build the Tauri bundle. No tag/release here — release job faz isso depois
      # com artifacts de todos os runners (evita race condition).
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0.5.22
        with:
          # `tauri build` não aceita --locked diretamente. Cargo flags vão depois de `--`.
          args: '-- --locked'

      # Coleta tudo que esse runner produziu num diretório uniforme pra upload.
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          shopt -s nullglob 2>/dev/null || true
          # .dmg (macOS)
          cp target/release/bundle/dmg/*.dmg           dist-release/ 2>/dev/null || true
          # .msi + .exe (Windows)
          cp target/release/bundle/msi/*.msi           dist-release/ 2>/dev/null || true
          cp target/release/bundle/nsis/*.exe          dist-release/ 2>/dev/null || true
          # AppImage + .deb + .rpm (Linux)
          cp target/release/bundle/appimage/*.AppImage dist-release/ 2>/dev/null || true
          cp target/release/bundle/deb/*.deb           dist-release/ 2>/dev/null || true
          cp target/release/bundle/rpm/*.rpm           dist-release/ 2>/dev/null || true
          echo "== artifacts for ${{ matrix.name }} =="
          ls -lah dist-release/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boracall-${{ matrix.name }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

      # Publica esse bundle no VPS assim que esse runner específico termina —
      # sem esperar os outros. Cada plataforma fica online independentemente.
      - name: Install SSH key
        if: ${{ inputs.skip_deploy != true && vars.DEPLOY_ENABLED == 'true' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust VPS host key
        if: ${{ inputs.skip_deploy != true && vars.DEPLOY_ENABLED == 'true' }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 20 -p 22 "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Rsync desta plataforma → VPS + update symlinks
        if: ${{ inputs.skip_deploy != true && vars.DEPLOY_ENABLED == 'true' }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -avz dist-release/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/boracall/downloads/"
          # Reponta os symlinks estáveis (BoraCall-macos-arm64.dmg, etc) pro bundle mais novo
          # do tipo que essa plataforma acabou de subir. Script vive em /usr/local/bin.
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "chown -R www-data:www-data /var/www/boracall/downloads && /usr/local/bin/boracall-update-symlinks"

  # ---------------------------------------------------------------------------
  # Release: gera SHA256SUMS global + cria GH Release draft (best-effort)
  # Roda depois de TODOS os builds terminarem (sucesso OU falha) pra o que
  # estiver disponível entrar no release.
  # ---------------------------------------------------------------------------
  release:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts de todas as plataformas
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten + SHA256SUMS
        run: |
          mkdir -p out
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp -n {} out/ \;
          ( cd out && shasum -a 256 * > SHA256SUMS )
          echo "== bundles finais =="
          ls -lah out/

      # SHA256SUMS atualizado no VPS com TODOS os bundles já publicados
      # (por qualquer plataforma que tenha finalizado, parcial OK).
      - name: Install SSH key
        if: ${{ inputs.skip_deploy != true && vars.DEPLOY_ENABLED == 'true' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Regenerate SHA256SUMS on VPS
        if: ${{ inputs.skip_deploy != true && vars.DEPLOY_ENABLED == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 20 -p 22 "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /var/www/boracall/downloads && \
            sha256sum BoraCall*.dmg *.exe *.msi *.AppImage *.deb *.rpm 2>/dev/null > SHA256SUMS && \
            chown www-data:www-data SHA256SUMS && cat SHA256SUMS"

      # --- GitHub Release ---
      - name: Criar/atualizar GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: BoraCall ${{ github.ref_name || github.event.inputs.version }}
          draft: true
          prerelease: false
          body: |
            Bundles nativos para macOS (Apple Silicon + Intel), Windows e Linux.

            Espelhados também em https://boracall.com/downloads/ (com TLS via Cloudflare).
            Verifique integridade com o `SHA256SUMS`.
          files: |
            out/*
