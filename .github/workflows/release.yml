name: release

# Dispara em tag "v*.*.*" (ou manual). Roda builds nativos em 4 runners em paralelo,
# coleta os bundles, publica em /var/www/boracall/downloads/ no VPS e cria um GitHub
# Release draft com todos os artefatos + SHA256SUMS.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (sem o "v" na frente), ex: 0.1.0'
        required: true
        default: '0.1.0'
      skip_deploy:
        description: 'Pular rsync pro VPS (só gera artefatos)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write  # necessário para criar o GH Release

env:
  # Único lugar pra trocar a versão do action (pinada, não flutuante).
  TAURI_ACTION_VERSION: v0.5.22

jobs:
  # ---------------------------------------------------------------------------
  # Build em 4 runners: macOS ARM + macOS Intel + Linux + Windows
  # ---------------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest              # arm64 nativo
            bundle-glob: '*.dmg'
          - name: macos-intel
            runner: macos-latest              # cross-compile Intel no runner ARM
            target: x86_64-apple-darwin       # macos-13 (Intel) foi retirado pelo GitHub
            bundle-glob: '*.dmg'
          - name: linux
            runner: ubuntu-24.04
            bundle-globs: '*.AppImage,*.deb,*.rpm'
          - name: windows
            runner: windows-latest
            bundle-globs: '*.msi,*.exe'

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
            server

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Install node modules
        run: npm ci || npm install

      # Reescreve env.js pra apontar pra produção — ANTES do tauri build,
      # porque o dist/ é embutido dentro do binário em compile time.
      - name: Bake production env.js
        shell: bash
        run: |
          cat > dist/env.js <<'EOF'
          (function () {
            window.BC_API_URL    = window.BC_API_URL    || "https://api.boracall.com";
            window.BC_PUBLIC_URL = window.BC_PUBLIC_URL || "https://boracall.com";
          })();
          EOF

      # Build the Tauri bundle. Usamos retry pra absorver flakiness do
      # bundle_dmg.sh no macOS (hdiutil às vezes trava no runner).
      - name: Build Tauri
        uses: nick-fields/retry@v3
        env:
          TARGET: ${{ matrix.target }}
          # Assinatura do updater. Chave privada vem do GH secret (base64 ed25519).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          timeout_minutes: 25
          max_attempts: 2
          retry_wait_seconds: 15
          shell: bash
          command: |
            if [ -n "$TARGET" ]; then
              npm run tauri build -- --target "$TARGET" -- --locked
            else
              npm run tauri build -- -- --locked
            fi

      # Coleta tudo que esse runner produziu num diretório uniforme pra upload.
      # Inclui instaladores (.dmg/.msi/.exe/.AppImage/.deb/.rpm) + artefatos do
      # updater (.app.tar.gz, .AppImage.tar.gz, .nsis.zip/.msi.zip) + .sig de cada.
      # Coleta o que este runner produziu num diretório uniforme.
      #
      # Os artefatos do updater ganham prefixo da plataforma: os dois jobs de
      # macOS geram "BoraCall.app.tar.gz" com o MESMO nome, e como todos sobem
      # pro mesmo diretório do VPS, o segundo sobrescrevia o primeiro. O
      # latest.json ficava com as duas arquiteturas apontando pro mesmo arquivo,
      # com assinaturas diferentes — o updater de uma delas recusava a
      # atualização por assinatura inválida, em silêncio.
      - name: Collect artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLAT: ${{ matrix.name }}
        run: |
          mkdir -p dist-release
          BUNDLE_ROOT="target/release/bundle"
          if [ -n "$TARGET" ]; then BUNDLE_ROOT="target/$TARGET/release/bundle"; fi
          echo "coletando de $BUNDLE_ROOT"

          echo "== tudo que o bundle produziu =="
          find "$BUNDLE_ROOT" -type f | sed 's|^|  |' || true

          # Instaladores, com o nome que o Tauri deu.
          for p in dmg/*.dmg msi/*.msi nsis/*.exe appimage/*.AppImage deb/*.deb rpm/*.rpm; do
            for f in "$BUNDLE_ROOT"/$p; do
              [ -f "$f" ] && cp "$f" dist-release/ && echo "instalador: $(basename "$f")"
            done
          done

          # Artefatos do updater + assinatura, prefixados pela plataforma.
          # A busca é por extensão em vez de caminho fixo pra não depender de
          # onde cada versão do Tauri resolve colocá-los.
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/${PLAT}-$(basename "$f")"
            echo "updater: ${PLAT}-$(basename "$f")"
          done < <(find "$BUNDLE_ROOT" -type f \( \
                     -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o \
                     -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' -o \
                     -name '*.nsis.zip' -o -name '*.nsis.zip.sig' -o \
                     -name '*.msi.zip' -o -name '*.msi.zip.sig' \) 2>/dev/null)

          echo "== artefatos de ${PLAT} =="
          ls -lah dist-release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boracall-${{ matrix.name }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

      # Publica esse bundle no VPS assim que esse runner específico termina —
      # sem esperar os outros. Cada plataforma fica online independentemente.
      - name: Install SSH key
        if: ${{ inputs.skip_deploy != true && vars.DEPLOY_ENABLED == 'true' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust VPS host key
        if: ${{ inputs.skip_deploy != true && vars.DEPLOY_ENABLED == 'true' }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 20 -p 22 "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload esta plataforma → VPS + update symlinks
        if: ${{ inputs.skip_deploy != true && vars.DEPLOY_ENABLED == 'true' }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -x
          ls -la dist-release/
          echo "--- testing ssh first ---"
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "echo ssh-ok && whoami"
          echo "--- uploading bundles ---"
          # scp each file (no -O flag — not supported across all scp versions)
          cd dist-release
          for f in *; do
            [ -f "$f" ] || continue
            echo "uploading: $f"
            scp -o StrictHostKeyChecking=no -o BatchMode=yes "$f" "$DEPLOY_USER@$DEPLOY_HOST:/var/www/boracall/downloads/"
          done
          scp -o StrictHostKeyChecking=no scripts/update-symlinks.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/usr/local/bin/boracall-update-symlinks"
          ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "
            chmod 755 /usr/local/bin/boracall-update-symlinks
            chown -R www-data:www-data /var/www/boracall/downloads
            /usr/local/bin/boracall-update-symlinks"

  # ---------------------------------------------------------------------------
  # Release: gera SHA256SUMS global + cria GH Release draft (best-effort)
  # Roda depois de TODOS os builds terminarem (sucesso OU falha) pra o que
  # estiver disponível entrar no release.
  # ---------------------------------------------------------------------------
  release:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts de todas as plataformas
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten + SHA256SUMS
        run: |
          mkdir -p out
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp -n {} out/ \;
          ( cd out && shasum -a 256 * > SHA256SUMS )
          echo "== bundles finais =="
          ls -lah out/

      # SHA256SUMS atualizado no VPS com TODOS os bundles já publicados
      # (por qualquer plataforma que tenha finalizado, parcial OK).
      - name: Install SSH key
        if: ${{ inputs.skip_deploy != true && vars.DEPLOY_ENABLED == 'true' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Regenerate SHA256SUMS on VPS
        if: ${{ inputs.skip_deploy != true && vars.DEPLOY_ENABLED == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 20 -p 22 "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /var/www/boracall/downloads && \
            sha256sum BoraCall*.dmg *.exe *.msi *.AppImage *.deb *.rpm 2>/dev/null > SHA256SUMS && \
            chown www-data:www-data SHA256SUMS && cat SHA256SUMS"

      # Gera latest.json pro tauri-plugin-updater. Lê os .sig dos artifacts,
      # embute no JSON e uploada pro VPS. Os bundles .app.tar.gz / .AppImage.tar.gz
      # / .nsis.zip já foram uploadados pelos jobs de build.
      - name: Build & upload latest.json
        if: ${{ inputs.skip_deploy != true && vars.DEPLOY_ENABLED == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
        run: |
          set -e
          VER="${VERSION#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DOWNLOADS="https://boracall.com/downloads"

          find_one() {
            find "$1" -type f -name "$2" 2>/dev/null | head -1
          }
          platform_json() {
            local file="$1" sig="$2"
            if [ -z "$file" ] || [ ! -f "$file" ] || [ ! -f "$sig" ]; then
              echo "null"
              return
            fi
            jq -n \
              --arg url "$DOWNLOADS/$(basename "$file")" \
              --rawfile signature "$sig" \
              '{url: $url, signature: ($signature | rtrimstr("\n"))}'
          }

          DARWIN_ARM=$(platform_json \
            "$(find_one artifacts/boracall-macos-arm64 'macos-arm64-*.app.tar.gz')" \
            "$(find_one artifacts/boracall-macos-arm64 'macos-arm64-*.app.tar.gz.sig')")
          DARWIN_X86=$(platform_json \
            "$(find_one artifacts/boracall-macos-intel 'macos-intel-*.app.tar.gz')" \
            "$(find_one artifacts/boracall-macos-intel 'macos-intel-*.app.tar.gz.sig')")
          LINUX_X86=$(platform_json \
            "$(find_one artifacts/boracall-linux 'linux-*.AppImage.tar.gz')" \
            "$(find_one artifacts/boracall-linux 'linux-*.AppImage.tar.gz.sig')")
          WIN_X86=$(platform_json \
            "$(find_one artifacts/boracall-windows 'windows-*.nsis.zip')" \
            "$(find_one artifacts/boracall-windows 'windows-*.nsis.zip.sig')")

          # Publicar um latest.json faltando plataforma é pior que não publicar:
          # o updater daquela plataforma nunca mais oferece atualização, e nada
          # avisa. Antes era exatamente o que acontecia com Windows e Linux.
          faltou=0
          for par in "darwin-aarch64:$DARWIN_ARM" "darwin-x86_64:$DARWIN_X86" \
                     "linux-x86_64:$LINUX_X86" "windows-x86_64:$WIN_X86"; do
            nome="${par%%:*}"; valor="${par#*:}"
            if [ "$valor" = "null" ]; then
              echo "::error::sem artefato de updater pra $nome"
              faltou=$((faltou + 1))
            fi
          done
          if [ "$faltou" -gt 0 ]; then
            echo "::error::$faltou plataforma(s) sem updater — veja o passo Collect de cada build"
            exit 1
          fi

          jq -n \
            --arg version "$VER" \
            --arg pub_date "$PUB_DATE" \
            --argjson darwin_arm "$DARWIN_ARM" \
            --argjson darwin_x86 "$DARWIN_X86" \
            --argjson linux_x86 "$LINUX_X86" \
            --argjson win_x86 "$WIN_X86" \
            '{
              version: $version,
              notes: "BoraCall \($version)",
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": $darwin_arm,
                "darwin-x86_64":  $darwin_x86,
                "linux-x86_64":   $linux_x86,
                "windows-x86_64": $win_x86
              }
            }' > out/latest.json

          # Duas plataformas apontando pro mesmo arquivo é o bug de colisão de
          # nome voltando; falha aqui em vez de publicar update que não instala.
          distintas=$(jq -r '[.platforms[].url] | unique | length' out/latest.json)
          if [ "$distintas" -lt 4 ]; then
            echo "::error::latest.json tem URLs repetidas entre plataformas"
            jq . out/latest.json
            exit 1
          fi

          echo "== latest.json =="
          jq . out/latest.json

          scp -o StrictHostKeyChecking=no out/latest.json \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/boracall/downloads/latest.json"
          ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            "chown www-data:www-data /var/www/boracall/downloads/latest.json"

      # --- GitHub Release ---
      - name: Criar/atualizar GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: BoraCall ${{ github.ref_name || github.event.inputs.version }}
          draft: true
          prerelease: false
          body: |
            Bundles nativos para macOS (Apple Silicon + Intel), Windows e Linux.

            Espelhados também em https://boracall.com/downloads/ (com TLS via Cloudflare).
            Verifique integridade com o `SHA256SUMS`.
          files: |
            out/*
