name: deploy-landing

# Publica a landing estática no VPS toda vez que algo em landing/ muda no main.
# Bem rápido (~20s): rsync + correção de ownership. Não precisa build.

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  workflow_dispatch:  # disparo manual também

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust VPS host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Diagnóstico + retries. Runners do GH às vezes têm firewall de saída
          # e o ssh-keyscan default dá 5s só — generoso aqui.
          echo "probing TCP 22 on $DEPLOY_HOST ..."
          for i in 1 2 3 4 5; do
            if nc -zvw5 "$DEPLOY_HOST" 22; then
              echo "tcp:22 reachable on attempt $i"
              break
            fi
            echo "attempt $i failed, retrying..."
            sleep 3
          done
          ssh-keyscan -T 20 -p 22 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1 | tee -a ~/.ssh/known_hosts_debug
          wc -l ~/.ssh/known_hosts
          head -1 ~/.ssh/known_hosts || { echo "keyscan produced no output"; exit 1; }

      - name: Rsync landing → /var/www/boracall/site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -avz --delete \
            --exclude='.DS_Store' \
            landing/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/boracall/site/"

      - name: Fix ownership + verify
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "chown -R www-data:www-data /var/www/boracall/site"
          # Smoke: landing responde e a versão nova tá servida
          curl -sI "https://boracall.com/?ci=$GITHUB_SHA" | head -3
          TITLE=$(curl -s "https://boracall.com/?ci=$GITHUB_SHA" | grep -oE '<title>[^<]+</title>' | head -1)
          echo "served title: $TITLE"
